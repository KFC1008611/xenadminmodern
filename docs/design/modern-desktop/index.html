    function vmTable(list,brief=false){return `<table class="data-table"><thead><tr>${brief?'':'<th class="checkbox-cell"><input type="checkbox" id="select-all" aria-label="选择当前筛选内的全部虚拟机" '+(list.length&&list.every(v=>state.selected.has(v.id))?'checked':'')+'></th>'}<th>名称</th><th>状态</th><th class="hide-narrow">${brief?'所在主机':'IP 地址'}</th><th>CPU</th><th>内存</th>${brief?'':'<th class="hide-medium">资源池</th>'}<th style="width:80px">操作</th></tr></thead><tbody id="vm-rows">${vmRows(list,brief)}</tbody></table>`}

    function storagePage(){return pageHeading('存储',`${scoped(stores).length} 个存储仓库 · 容量单位 TiB`,button('添加存储','create-storage','plus','primary'))+`<div class="toolbar" style="padding:0 0 16px;border:0"><span class="small muted">存储仓库</span><div class="filters">${poolSelect()}</div></div><div class="resource-grid">${scoped(stores).map(s=>`<button class="panel resource-card selectable" data-action="storage-detail" data-id="${s.id}"><div class="between"><span class="object-icon">${icon(s.type.includes('ISO')?'disc-3':'hard-drive')}</span><div class="flex gap6">${s.default?'<span class="badge purple">默认存储</span>':''}${badge('已连接','green')}</div></div><h2>${s.name}</h2><p class="muted small">${s.type} <span class="faint">·</span> ${poolName(s.pool)}</p><div class="meter"><span class="${s.used/s.total>=.7?'warn':''}" style="width:${s.used/s.total*100}%"></span></div><div class="between small"><span class="num">${s.used.toFixed(2)} <span class="faint">/ ${s.total.toFixed(1)} TiB</span></span><span class="muted num">${Math.round(s.used/s.total*100)}%</span></div><div class="card-details"><div><div class="detail-label">${s.type.includes('ISO')?'镜像':'虚拟磁盘'}</div><div class="detail-value">${s.disks} 个</div></div><div><div class="detail-label">接入主机</div><div class="detail-value">${s.hosts} 台</div></div></div><div class="card-actions"><span class="small faint">查看详情</span>${icon('arrow-up-right')}</div></button>`).join('')}</div>`}

    function settingsPage(){return pageHeading('设置','管理外观与桌面工作习惯')+`<div class="settings-grid"><nav class="settings-nav" aria-label="设置分类">${[['appearance','外观'],['connections','连接'],['notifications','通知']].map(([id,label])=>`<button class="${state.settingsTab===id?'active':''}" data-action="settings-tab" data-tab="${id}">${label}</button>`).join('')}</nav><div>${state.settingsTab==='appearance'?`<section class="panel settings-block"><h2>外观模式</h2><p class="setting-desc">选择应用的浅色或深色外观。</p><div class="appearance-options">${['light','dark'].map(t=>`<button class="appearance-option ${state.theme===t?'active':''}" data-action="theme" data-theme="${t}" aria-pressed="${state.theme===t}"><span class="theme-preview ${t==='dark'?'dark':''}"><span class="theme-preview-side"><span></span><span></span><span></span><span></span></span><span class="theme-preview-main"><span></span><span></span><span></span></span></span><span class="appearance-label"><span>${t==='light'?'浅色':'深色'}</span>${state.theme===t?icon('circle-check'):icon(t==='light'?'sun':'moon')}</span></button>`).join('')}</div></section><section class="panel settings-block"><h2>显示</h2><div class="setting-row"><div><div>表格密度</div><div class="setting-desc">调整列表行高，适应不同桌面尺寸。</div></div><div class="segmented" role="group" aria-label="表格密度"><button data-action="set-density" data-density="comfortable" class="${state.density==='comfortable'?'active':''}" aria-pressed="${state.density==='comfortable'}">舒适</button><button data-action="set-density" data-density="compact" class="${state.density==='compact'?'active':''}" aria-pressed="${state.density==='compact'}">紧凑</button></div></div><div class="setting-row"><div><div>数值单位</div><div class="setting-desc">内存与磁盘使用二进制容量单位。</div></div><span class="small muted">GiB / TiB</span></div></section>`:state.settingsTab==='connections'?`<section class="panel settings-block"><h2>管理连接</h2>${pools.map(p=>`<div class="setting-row"><div><div>${p.name}</div><div class="setting-desc mono">${hosts.fin     const modal=$('#modal');let lastTrigger=null;let wizard=null;let toastTimer;
    function showModal(title,sub,body,footer='',cls=''){
      if(!modal.open)lastTrigger=document.activeElement;
      modal.className=cls;modal.innerHTML=`<div class="modal-header"><div><h2 class="modal-title" id="modal-title">${esc(title)}</h2>${sub?`<p class="modal-sub">${esc(sub)}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div><div class="modal-content">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}`;
      if(!modal.open)modal.showModal();const firstField=modal.querySelector('.modal-content input:not([type="radio"]):not([type="checkbox"]), .modal-content select, .modal-content textarea');if(firstField)firstField.focus();else (modal.querySelector('.modal-footer .button.primary')||modal.querySelector('[data-action="close-modal"]'))?.focus();
    }
    function closeModal(){modal.close();wizard=null;if(lastTrigger?.isConnected)lastTrigger.focus()}
    function toast(message){clearTimeout(toastTimer);const content=icon('circle-check')+`<span>${esc(message)}</span>`;if(modal.open){$('#toast').classList.remove('visible');let feedback=$('#modal-feedback');if(!feedback){feedback=document.createElement('div');feedback.id='modal-feedback';feedback.className='modal-feedback';feedback.setAttribute('role','status');modal.append(feedback)}feedback.innerHTML=content;toastTimer=setTimeout(()=>feedback.remove(),3400)}else{$('#toast').innerHTML=content;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3400)}}
    function taskDrawer(){showModal('任务面板',`${tasks.filter(t=>t.status==='running').length} 项进行中 · 所有任务仅为样机演示`,tasks.map((t,i)=>`<div class="task-item"><div class="between"><span class="task-title">${icon(t.type==='export'?'arrow-up-from-line':t.status==='success'?'circle-check':'activity')}${esc(t.title)}</span>${t.status==='running'?`<span class="small" style="color:var(--accent-text)">${t.progress}%</span>`:taskState(t)}</div><p class="small muted" style="margin:6px 0 0 24px">${poolName(t.pool)} · ${esc(t.resource)}</p>${t.status==='running'?`<div class="task-progress"><span style="width:${t.progress}%"></span></div><div class="task-meta"><span>1.36 / 2.00 GiB · 23.4 MiB/s</span><button class="text-button" style="font-size:11px" data-action="cancel-task" data-index="${i}">取消</button></div>`:`<div class="task-meta" style="margin:12px 0 0 24px"><span>今天 ${t.time}</span><span>${t.duration}</span></div>`}</div>`).join(''),`<span class="small faint">切换页面后任务入口持续保留</span><button class="text-button" data-action="all-tasks">全部任务${icon('arrow-right')}</button>`,'drawer')}
    function openWizard(){wizard={step:0,name:'ubuntu-app-01',template:'Ubuntu 24.04 LTS',pool:state.pool==='all'?'prod':state.pool,cores:4,ram:8,disk:80,network:'Production · VLAN 100'};renderWizard()}
    function renderWizard(){
      const w=wizard;if(!w)return;const maxMemory=Math.max(...hosts.filter(h=>h.pool===w.pool&&!h.maintenance).map(h=>128-h.memory));let body=`<div class="steps">${['基本信息','配置资源','确认创建'].map((label,i)=>`<div class="step ${w.step===i?'active':''}"><span>${w.step>i?'✓':i+1}</span>${label}</div>`).join('')}</div>`;
      if(w.step===0)body+=`<div class="form-grid"><label class="field">名称<input id="wizard-name" value="${esc(w.name)}" maxlength="80" required autocomplete="off"></label><label class="field">目标资源池<select id="wizard-pool">${pools.map(p=>`<option value="${p.id}" ${w.pool===p.id?'selected':''}>${p.name}</option>`).join('')}</select></label><div class="field full"><span>操作系统模板</span><div class="template-options">${['Ubuntu 24.04 LTS','Debian 12','Windows Server 2022'].map(t=>`<label class="template-option ${w.template===t?'selected':''}"><span class="object-icon">${icon(t.includes('Windows')?'panels-top-left':'disc-3')}</span><span><span style="font-weight:500">${t}</span><span class="field-help" style="display:block">系统模板</span></span><input type="radio" name="template" value="${t}" ${w.template===t?'checked':''}></label>`).join('')}</div></div></div>`;
      else if(w.step===1)body+=`<div class="form-grid"><label class="field">vCPU 数量<input id="wizard-cpu" type="number" min="1" max="32" step="1" value="${w.cores}" required><span class="field-help">1–32 个 vCPU</span></label><label class="field">内存（GiB）<input id="wizard-ram" type="number" min="1" max="${maxMemory}" step="1" value="${w.ram}" required><span class="field-help">单台主机最多可用 ${maxMemory} GiB</span></label><label class="field">系统磁盘（GiB）<input id="wizard-disk" type="number" min="10" max="2000" step="1" value="${w.disk}" required></label><label class="field">存储仓库<select id="wizard-storage">${stores.filter(s=>s.pool===w.pool&&!s.type.includes('ISO')).map(s=>`<option>${s.name}</option>`).join('')}</select></label><label class="field full">网络<select id="wizard-network">${networks.filter(n=>n.pool===w.pool&&n.type!=='管理网络'&&n.type!=='存储网络').map(n=>`<option value="${esc(n.name)}" ${w.network===n.name?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><div class="field full"><span class="notice soft" style="margin:0">${icon('info')}根据当前资源情况自动选择可用主机。</span></div></div>`;
      else body+=`<div class="review-block">${[['名称',w.name],['目标资源池',poolName(w.pool)],['模板',w.template],['计算资源',`${w.cores} vCPU · ${w.ram} GiB 内存`],['磁盘',`${w.disk} GiB · ${w.storage||stores.find(s=>s.pool===w.pool).name}`],['网络',w.network],['创建后启动','否']].map(([l,v])=>`<div class="info-row"><span>${l}</span><span>${esc(v)}</span></div>`).join('')}</div><p class="small muted" style="margin-top:17px">此操作仅在 HTML 样机内添加演示虚拟机。</p>`;
      body+='<p class="error-msg" id="wizard-error" role="alert"></p>';
      showModal('创建虚拟机',`目标资源池：${poolName(w.pool)}`,body,`<span class="small faint">${w.step+1} / 3</span><div class="actions">${button(w.step===0?'取消':'上一步',w.step===0?'close-modal':'wizard-back')}${button(w.step===2?'创建虚拟机':'下一步',w.step===2?'wizard-create':'wizard-next',w.step===2?'plus':'arrow-right','primary')}</div>`);
    }
    function collectWizard(){
      if(wizard.step===0){const input=$('#wizard-name');if(!input.value.trim()){input.focus();$('#wizard-error').textContent='请输入虚拟机名称';return false}wizard.name=input.value.trim();const p=$('#wizard-pool').value;if(p!==wizard.pool)wizard.network=networks.find(n=>n.pool===p&&n.type==='外部网络').name;wizard.pool=p;wizard.template=$('input[name="template"]:checked').value;}
      if(wizard.step===1){for(const id of ['wizard-cpu','wizard-ram','wizard-disk']){if(!$('#'+id).reportValidity())return false}wizard.cores=Number($('#wizard-cpu').value);wizard.ram=Number($('#wizard-ram').value);wizard.disk=Number($('#wizard-disk').value);wizard.network=$('#wizard-network').value;wizard.storage=$('#wizard-storage').value;}

    }

    function storageDetail(s){showModal(s.name,`${s.type} · ${poolName(s.pool)}`,`<div class="between" style="margin-bottom:18px">${badge('已连接','green')}<span class="small num muted">${s.used.toFixed(2)} / ${s.total.toFixed(1)} TiB</span></div><div class="tabs" style="padding:0;margin-bottom:10px"><span class="tab active">概览</span></div><div class="review-block">${[['存储类型',s.type],['位置',s.path],['已使用',Math.round(s.used/s.total*100)+'%'],['可用空间',(s.total-s.used).toFixed(2)+' TiB'],['虚拟磁盘',s.disks+' 个'],['接入主机',s.hosts+' 台'],['默认存储',s.default?'是':'否']].map(([l,v])=>`<div class="info-row"><span>${l}</span><span>${esc(v)}</span></div>`).join('')}</div><h3 style="margin:23px 0 12px">接入主机</h3>${hosts.filter(h=>h.pool===s.pool).map(h=>`<div class="between" style="padding:8px 0"><span class="flex gap8 small">${icon('server')}${h.name}</span>${badge('已连接','green')}</div>`).join('')}`,`<span class="small faint">${poolName(s.pool)}</span><div class="actions">${button('扫描仓库','scan-storage','refresh-cw','',`data-id="${s.id}"`)}${button('关闭','close-modal')}</div>`,'drawer')}
    function networkDetail(n){showModal(n.name,`${n.type} · ${poolName(n.pool)}`,`<div class="review-block">${[['VLAN',n.vlan],['MTU',n.mtu],['物理接口',n.physical],['接入虚拟机',n.vms+' 台']].map(([l,v])=>`<div class="info-row"><span>${l}</span><span>${v}</span></div>`).join('')}</div><h3 style="margin:22px 0 12px">连接关系</h3><div class="network-line" style="padding-left:0;padding-right:0"><span class="network-node"><span class="object-icon">${icon('network')}</span>${n.physical}</span><span class="network-stem">VLAN ${n.vlan}</span><span class="small">虚拟交换机</span></div><div class="info-row"><span>主机接入</span><span>${n.physical==='无'?'无物理上联':hosts.filter(h=>h.pool===n.pool).length+' 台'}</span></div>`,`<span class="small faint">网络详情预览</span>${button('关闭','close-modal')}`,'drawer')}
    function showSearch(){showModal('搜索资源','',``, '', 'command-dialog');modal.innerHTML=`<div class="command-input">${icon('search')}<label class="sr-only" for="command-search">搜索资源</label><input id="command-search" placeholder="搜索虚拟机、主机、存储…" autocomplete="off"><kbd>ESC</kbd></div><div class="command-results" id="command-results"></div><div class="command-footer">搜索范围：全部已连接资源池</div>`;modal.setAttribute('aria-label','搜索资源');renderSearch('');$('#command-search').focus()}
    function renderSearch(query){const q=query.toLowerCase();const results=[...vms.map(v=>({label:v.name,meta:poolName(v.pool),icon:'monitor',action:'vm-detail',attrs:`data-id="${v.id}"`})),...hosts.map(h=>({label:h.name,meta:'主机',icon:'server',action:'host-detail',attrs:`data-name="${h.name}"`})),...stores.map(s=>({label:s.name,meta:'存储',icon:'hard-drive',action:'storage-detail',attrs:`data-id="${s.id}"`}))].filter(r=>(r.label+' '+r.meta).toLowerCase().includes(q)).slice(0,8);$('#command-results').innerHTML=`<div class="command-label">${q?'搜索结果':'最近访问'}</div>`+results.map(r=>`<button class="command-result" data-action="${r.action}" ${r.attrs}>${icon(r.icon)}${esc(r.label)}<span class="muted">${r.meta}</span>${icon('arrow-up-right')}</button>`).join('')+(results.length?'':'<div class="empty">没有找到资源</div>')}
    function openSimpleForm(kind){
      const configs={connect:{title:'添加管理连接',sub:'连接 XCP-ng / XenServer 资源池',body:`<label class="field">连接名称<input id="simple-name" placeholder="例如：生产资源池" required></label><label class="field">服务器地址<input id="simple-address" placeholder="xcp.example.test" required></label><label class="field">用户名<input value="root" autocomplete="off"></label><label class="field">密码<input type="password" autocomplete="new-password" placeholder="样机无需填写真实密码"></label>`,submit:'模拟连接'},'create-storage':{title:'添加存储仓库',sub:'配置仓库类型与接入位置',body:`<label class="field">名称<input id="simple-name" placeholder="Shared Storage" required></label><label class="field">目标资源池<select id="simple-pool">${pools.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label class="field">类型<select><option>NFS</option><option>iSCSI</option></select></label><label class="field">服务器地址<input placeholder="storage.example.test"></label><label class="field full">共享路径<input placeholder="/data/xcp"></label>`,submit:'预览配置'},'create-network':{title:'创建内部网络',sub:`目标资源池：${poolName(state.pool==='all'?'prod':state.pool)}`,body:`<label class="field full">名称<input id="simple-name" placeholder="例如：应用内部网络" required></label><label class="field full">描述<textarea rows="3" placeholder="可选"></textarea></label><div class="field full"><span class="field-help">内部网络无物理上联，用于同一主机上的虚拟机通信。</span></div>`,submit:'创建演示网络'}};
      const c=configs[kind];showModal(c.title,c.sub,`<div class="form-grid">${c.body}</div><p class="error-msg" id="simple-error" role="alert"></p>`,`<span class="small faint">所有内容仅用于样机演示</span><div class="actions">${button('取消','close-modal')}${button(c.submit,'simple-submit','check','primary',`data-kind="${kind}"`)}</div>`)
    }
    function snapshotForm(ids){showModal('创建快照',`${ids.length} 台虚拟机 · 演示操作`,`<label class="field">快照名称<input id="snapshot-name" placeholder="例如：pre-update" value="manual-snapshot"></label><div class="review-block" style="margin-top:20px">${ids.map(id=>{const v=vms.find(v=>v.id===id);return `<div class="info-row"><span>${poolName(v.pool)}</span><span>${esc(v.name)}</span></div>`}).join('')}</div>`,`<div class="actions">${button('取消','close-modal')}${button('创建快照','confirm-snapshot','camera','primary',`data-ids="${ids.join(',')}"`)}</div>`)}
    document.addEventListener('click',event=>{
      const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=Number(el.dataset.id),v=vms.find(v=>v.id===id);
      if(a==='nav'){if(modal.open)closeModal();nav(el.dataset.view)}
      else if(a==='theme'){state.theme=el.dataset.theme;render()}
      else if(a==='scope')showModal('选择资源范围','切换页面所展示的资源池',`<button class="command-result" data-action="set-pool" data-pool="all">${icon('layers')}全部资源池<span class="muted">6 台主机</span>${state.pool==='all'?icon('check'):''}</button>${pools.map(p=>`<button class="command-result" data-action="set-pool" data-pool="${p.id}">${icon('layers')}${p.name}<span class="muted">${hosts.filter(h=>h.pool===p.id).length} 台主机</span>${state.pool===p.id?icon('check'):''}</button>`).join('')}`);
      else if(a==='set-pool'){state.pool=el.dataset.pool;state.selected.clear();closeModal();render()}
      else if(a==='pick-pool'){state.pool=el.dataset.pool;nav('overview')}
      else if(a==='refresh')toast('演示数据已刷新');
      else if(a==='search')showSearch();
      else if(a==='chart-range'){state.chartRange=el.dataset.range;renderContent()}
      else if(a==='vm-detail'){if(modal.open)closeModal();state.vm=id;state.vmTab='overview';nav('vm-detail')}
      else if(a==='vm-tab'){state.vmTab=el.dataset.tab;renderContent()}
      else if(a==='vm-filter'){state.vmFilter=el.dataset.filter;renderContent()}
      else if(a==='clear-filters'){state.vmFilter='all';state.pool='all';state.query='';render()}
      else if(a==='clear-selection'){state.selected.clear();renderContent()}
      else if(a==='density'){state.density=state.density==='compact'?'comfortable':'compact';applyTheme();toast(`表格已切换为${state.density==='compact'?'紧凑':'舒适'}密度`)}
      else if(a==='set-density'){state.density=el.dataset.density;render()}
      else if(a==='create-vm')openWizard();
      else if(a==='wizard-next'){if(collectWizard()){wizard.step++;renderWizard()}}
      else if(a==='wizard-back'){if(wizard.step===1)collectWizard();wizard.step--;renderWizard()}
      else if(a==='wizard-create'){const w=wizard;vms.unshift({id:Math.max(...vms.map(v=>v.id))+1,name:w.name,os:w.template,pool:w.pool,host:'—',status:'stopped',cpu:0,cores:w.cores,ram:w.ram,mem:0,ip:'—',tag:'',disk:w.disk});addTask('创建虚拟机',w.name,w.pool,'create');closeModal();state.pool=w.pool;state.vmFilter='all';nav('vms');toast(`演示虚拟机 ${w.name} 已创建`)}
      else if(a==='close-modal')closeModal();
      else if(a==='task-drawer')taskDrawer();
      else if(a==='all-tasks'){closeModal();nav('tasks')}
      else if(a==='cancel-task'){const t=tasks[Number(el.dataset.index)];t.status='cancelled';render();taskDrawer();toast('演示导出任务已取消')}
      else if(a==='task-filter'){state.taskFilter=el.dataset.filter;renderContent()}
      else if(a==='task-detail'){const t=tasks[Number(el.dataset.index)];showModal(t.title,'任务详情',`<div class="review-block">${[['对象',t.resource],['资源池',poolName(t.pool)],['开始时间','2026-10-23 '+t.time],['耗时',t.duration]].map(([l,val])=>`<div class="info-row"><span>${l}</span><span>${esc(val)}</span></div>`).join('')}<div class="info-row"><span>状态</span>${taskState(t)}</div></div>`,button('关闭','close-modal'))}
      else if(a==='power')confirmPower(v);
      else if(a==='confirm-power'){const action=v.status==='running'?'正常关机':v.status==='paused'?'恢复':'启动';v.status=v.status==='running'?'stopped':'running';v.host=v.status==='running'?hosts.find(h=>h.pool===v.pool&&!h.maintenance).name:'—';v.cpu=v.status==='running'?6:0;v.mem=v.status==='running'?1.2:0;addTask(action+'虚拟机',v.name,v.pool);closeModal();render();toast(`${v.name} ${action}演示完成`)}
      else if(a==='vm-menu'){showModal(v.name,'虚拟机操作',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['vm-detail','查看详情','monitor'],['snapshot','创建快照','camera'],['export-vm','导出 XVA','arrow-up-from-line'],['copy-vm','复制虚拟机','copy'],['relocate','迁移虚拟机','arrow-right-left'],['edit-vm','编辑信息','pencil']].map(([action,l,i])=>button(l,action,i,'',`data-id="${v.id}"`)).join('')}</div>`)}
      else if(a==='snapshot')snapshotForm([id]);
      else if(a==='confirm-snapshot'){const ids=el.dataset.ids.split(',').map(Number),name=$('#snapshot-name').value.trim()||'manual-snapshot';ids.forEach(i=>{const vm=vms.find(v=>v.id===i);addTask('创建快照 '+name,vm.name,vm.pool,'snapshot')});closeModal();state.selected.clear();render();toast(`${ids.length} 台虚拟机的快照演示完成`)}
      else if(a==='batch-snapshot')snapshotForm([...state.selected]);
      else if(a==='batch-review'||a==='batch-start'){const ids=[...state.selected];showModal(a==='batch-start'?'批量启动虚拟机':'已选虚拟机',`${ids.length} 台 · 请核对完整目标清单`,`<div class="review-block">${ids.map(i=>{const vm=vms.find(v=>v.id===i);return `<div class="info-row"><span>${vm.name}<span class="faint small" style="display:block">${poolName(vm.pool)}</span></span>${vmState(vm)}</div>`}).join('')}</div>`,`<span class="small faint">样机演示</span><div class="actions">${button('关闭','close-modal')}${a==='batch-start'?button('确认启动','confirm-batch','play','primary'):''}</div>`)}
      else if(a==='confirm-batch'){let count=0;state.selected.forEach(i=>{const vm=vms.find(v=>v.id===i);if(vm.status==='stopped'){vm.status='running';vm.cpu=5;vm.mem=.8;vm.host=hosts.find(h=>h.pool===vm.pool&&!h.maintenance).name;addTask('启动虚拟机',vm.name,vm.pool);count++}});state.selected.clear();closeModal();render();toast(`${count} 台已关机虚拟机完成启动演示`)}
      else if(a==='host-detail')hostDetail(hosts.find(h=>h.name===el.dataset.name));
      else if(a==='host-vms'){const h=hosts.find(h=>h.name===el.dataset.name);closeModal();state.pool=h.pool;nav('vms');toast(`已显示${poolName(h.pool)}的虚拟机`)}
      else if(a==='storage-detail')storageDetail(stores.find(s=>s.id===id));
      else if(a==='network-detail')networkDetail(networks.find(n=>n.name===el.dataset.name));
      else if(a==='scan-storage'){const s=stores.find(s=>s.id===id);addTask('扫描存储仓库',s.name,s.pool,'storage');toast('存储扫描演示完成')}
      else if(a==='connect'||a==='create-storage'||a==='create-network')openSimpleForm(a);
      else if(a==='simple-submit'){const name=$('#simple-name');if(!name.value.trim()){name.focus();$('#simple-error').textContent='请输入名称';return}const kind=el.dataset.kind;if(kind==='create-network'){networks.push({name:name.value.trim(),pool:state.pool==='all'?'prod':state.pool,vlan:'—',mtu:1500,physical:'无',vms:0,type:'内部网络'});addTask('创建网络',name.value.trim(),state.pool==='all'?'prod':state.pool,'network');closeModal();renderContent();toast('演示网络已创建')}else if(kind==='connect'){if(!$('#simple-address').value.trim()){$('#simple-address').focus();$('#simple-error').textContent='请输入服务器地址';return}showModal('连接配置预览','配置不会发送到真实服务器',`<div class="review-block"><div class="info-row"><span>名称</span><span>${esc(name.value.trim())}</span></div><div class="info-row"><span>地址</span><span>${esc($('#simple-address').value.trim())}</span></div><div class="info-row"><span>操作</span><span>演示连接</span></div></div>`,button('完成','close-modal','check','primary'))}else{toast('存储配置预览完成');closeModal()}}
      else if(a==='connection-detail'){const p=pools.find(p=>p.id===el.dataset.pool);showModal(p.name,'管理连接',`<div class="review-block"><div class="info-row"><span>管理地址</span><span class="mono">${hosts.find(h=>h.pool===p.id).ip}</span></div><div class="info-row"><span>用户名</span><span>root</span></div><div class="info-row"><span>状态</span>${badge('已连接','green')}</div><div class="info-row"><span>连接方式</span><span>XAPI · HTTPS</span></div></div>`,button('关闭','close-modal'))}
      else if(a==='alert-filter'){state.alertTab=el.dataset.filter;renderContent()}
      else if(a==='read-alert'){alerts.find(x=>x.id===id).read=true;render()}
      else if(a==='read-all'){alerts.forEach(x=>x.read=true);render();toast('已将全部消息标记为已读')}
      else if(a==='alert-resource'){if(id===1)storageDetail(stores[0]);else hostDetail(hosts[3])}
      else if(a==='settings-tab'){state.settingsTab=el.dataset.tab;renderContent()}
      else if(a==='toggle-setting'){const on=el.getAttribute('aria-checked')!=='true';el.classList.toggle('on',on);el.setAttribute('aria-checked',String(on));save('xam-notice-'+el.dataset.key,on?'on':'off')}
      else if(a==='vm-protect'){v.protected=!v.protected;renderContent();toast(`删除保护已${v.protected?'开启':'关闭'}，仅影响样机`)}
      else if(a==='templates'){showModal('虚拟机模板','系统模板与用户模板',`<div class="tabs" style="padding:0;margin-bottom:15px"><span class="tab active">系统模板</span><span class="tab">用户模板</span></div>${['Ubuntu 24.04 LTS','Debian 12','Windows Server 2022'].map(t=>`<div class="info-row"><span class="flex gap8">${icon('disc-3')}${t}</span><span class="badge">系统模板</span></div>`).join('')}`,`<span class="small faint">模板列表预览</span>${button('创建虚拟机','create-vm','plus','primary')}`)}
      else if(a==='topology'){showModal('网络拓扑',poolName(state.pool),scoped(networks).filter(n=>n.physical!=='无').map(n=>`<div class="network-line"><span class="network-node">${icon('server')}${n.physical}</span><span class="network-stem">${n.vlan==='未标记'?'未标记流量':'VLAN '+n.vlan}</span><span class="small">${n.name}</span></div>`).join(''),button('关闭','close-modal'))}
      else if(a==='alert-rules'){showModal('告警规则','阈值与通知预览',`<div class="review-block">${[['存储使用率','≥ 70%'],['主机内存使用率','≥ 90%'],['主机连接状态','断开连接'],['任务状态','明确失败']].map(([l,val])=>`<div class="info-row"><span>${l}</span><span class="badge">${val}</span></div>`).join('')}</div>`,button('关闭','close-modal'))}
      else if(a==='roles'){showModal('资源池角色','权限说明预览',`<div class="review-block">${[['池管理员','管理资源池内全部资源'],['池操作员','管理日常资源与运行状态'],['虚拟机管理员','管理虚拟机配置与运行状态'],['只读用户','查看资源与指标']].map(([l,d])=>`<div class="info-row"><span>${l}</span><span class="muted small">${d}</span></div>`).join('')}</div>`,button('关闭','close-modal'))}
      else if(a==='edit-vm'||a==='edit-compute'){showModal(a==='edit-vm'?'编辑虚拟机信息':'计算资源',v.name,a==='edit-vm'?`<label class="field">名称<input id="edit-name" value="${esc(v.name)}" required maxlength="80"></label><label class="field" style="margin-top:17px">描述<textarea id="edit-description" rows="3">${esc(v.description||'')}</textarea></label>`:`<div class="form-grid"><label class="field">vCPU<input id="edit-cores" type="number" min="1" max="32" step="1" value="${v.cores}"></label><label class="field">内存（GiB）<input id="edit-ram" type="number" min="1" max="128" step="1" value="${v.ram}"></label></div><p class="small muted" style="margin-top:18px">此处仅预览配置编辑流程。</p>`,`<div class="actions">${button('取消','close-modal')}${button('保存','save-vm','check','primary',`data-id="${id}" data-kind="${a}"`)}</div>`)}
      else if(a==='save-vm'){if(el.dataset.kind==='edit-vm'){if(!$('#edit-name').value.trim()){$('#edit-name').reportValidity();return}v.name=$('#edit-name').value.trim();v.description=$('#edit-description').value}else{if(!$('#edit-cores').reportValidity()||!$('#edit-ram').reportValidity())return;v.cores=Number($('#edit-cores').value);v.ram=Number($('#edit-ram').value)}closeModal();render();toast('样机配置已保存')}
      else if(a==='import'){showModal('导入 XVA','选择归档与目标资源池',`<label class="field">XVA 文件<input type="file" id="xva-file" accept=".xva"></label><label class="field" style="margin-top:18px">目标资源池<select>${pools.map(p=>`<option>${p.name}</option>`).join('')}</select></label><p class="small muted" style="margin-top:18px">样机仅预览本地文件名，不读取或上传文件内容。</p>`,`<div class="actions">${button('取消','close-modal')}${button('预览','preview-import','arrow-right','primary')}</div>`)}
      else if(a==='preview-import'){const f=$('#xva-file').files[0];if(!f){toast('请先选择一个 XVA 文件');return}showModal('归档预览',esc(f.name),`<div class="notice soft" style="margin:0">${icon('info')}这是交互样机；未解析文件内容。</div><div class="info-row" style="margin-top:12px"><span>文件大小</span><span>${(f.size/1024/1024).toFixed(1)} MiB</span></div>`,button('关闭','close-modal'))}
      else if(['export-vm','copy-vm','relocate'].includes(a)){const labels={'export-vm':'导出 XVA','copy-vm':'复制虚拟机',relocate:'迁移虚拟机'};showModal(labels[a],v.name,`<div class="review-block"><div class="info-row"><span>源虚拟机</span><span>${v.name}</span></div><div class="info-row"><span>当前资源池</span><span>${poolName(v.pool)}</span></div></div><label class="field" style="margin-top:20px">${a==='export-vm'?'导出模式':'目标资源池'}<select>${a==='export-vm'?'<option>正常关机后导出</option><option>Checkpoint（包含内存）</option>':pools.map(p=>`<option>${p.name}</option>`).join('')}</select></label><p class="small muted" style="margin-top:18px">此处预览操作入口与确认布局。</p>`,`<div class="actions">${button('取消','close-modal')}${button('完成预览','finish-preview','check','primary')}</div>`)}
      else if(a==='add-disk'||a==='add-vif'||a==='mount-iso'){showModal(a==='add-disk'?'添加磁盘':a==='add-vif'?'添加网卡':'挂载 ISO','设备配置预览',`<div class="form-grid">${a==='add-disk'?'<label class="field">名称<input value="data-disk"></label><label class="field">容量（GiB）<input type="number" value="100" min="1"></label><label class="field full">存储仓库<select><option>NVMe Shared Storage</option><option>Production Data</option></select></label>':a==='add-vif'?`<label class="field full">网络<select>${networks.map(n=>`<option>${n.name}</option>`).join('')}</select></label>`:'<label class="field full">镜像<select><option>ubuntu-24.04.1-live-server-amd64.iso</option><option>debian-12.7.0-amd64-netinst.iso</option></select></label>'}</div>`,`<div class="actions">${button('取消','close-modal')}${button('完成预览','finish-preview','check','primary')}</div>`)}
      else if(a==='finish-preview'){closeModal();toast('操作布局预览完成')}
      else if(a==='console-key')toast('已演示发送组合键；静态控制台不会执行命令');
    });
    document.addEventListener('input',event=>{if(event.target.id==='vm-search'){state.query=event.target.value;$('#vm-rows').innerHTML=vmRows(filteredVms());$('#vm-footer').innerHTML=tableFooter(filteredVms().length,'台虚拟机');$('#batch-container').innerHTML=batchBar();const all=$('#select-all');if(all)all.checked=filteredVms().length>0&&filteredVms().every(v=>state.selected.has(v.id))}else if(event.target.id==='command-search')renderSearch(event.target.value)});
    document.addEventListener('change',event=>{const el=event.target;if(el.id==='pool-filter'){state.pool=el.value;state.selected.clear();render()}else if(el.dataset.selectVm){const id=Number(el.dataset.selectVm);el.checked?state.selected.add(id):state.selected.delete(id);renderContent()}else if(el.id==='select-all'){filteredVms().forEach(v=>el.checked?state.selected.add(v.id):state.selected.delete(v.id));renderContent()}else if(el.name==='template'){$$('.template-option').forEach(t=>t.classList.toggle('selected',$('input',t).checked))}});
    document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();showSearch()}else if(event.key==='Enter'&&event.target.id==='command-search'){event.preventDefault();$('#command-results .command-result')?.click()}});
    modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal()}});
    modal.addEventListener('close',()=>{modal.removeAttribute('aria-label');if(lastTrigger?.isConnected)lastTrigger.focus()});
    render();
  })();
  </script>
</body>
</html>
