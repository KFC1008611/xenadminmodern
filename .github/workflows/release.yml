name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Verify release identity and signing inputs
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF!==`refs/tags/v${p.version}`) throw Error("Run this workflow on the matching version tag")'
          if [ "$RUNNER_OS" = macOS ]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = Windows ]; then
            test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD"
          fi
      - run: npm run typecheck:node && npm run typecheck:web && npm run lint && npm test
      - run: npm run build
      - name: Package signed application and update manifests
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npx --no-install electron-builder ${{ matrix.target }} --publish never -c.forceCodeSigning=true -c.mac.notarize.teamId="$APPLE_TEAM_ID"
            codesign --verify --deep --strict dist/mac-universal/*.app
            xcrun stapler validate dist/mac-universal/*.app
          elif [ "$RUNNER_OS" = Windows ]; then
            npx --no-install electron-builder ${{ matrix.target }} --publish never -c.forceCodeSigning=true
          else
            npx --no-install electron-builder ${{ matrix.target }} --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create draft with all platform update files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s release/latest.yml && test -s release/latest-mac.yml && test -s release/latest-linux.yml
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
